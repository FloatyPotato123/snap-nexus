<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Profile | Snap Nexus</title>
    <!-- Pico.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.slate.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <main class="container">
        <!-- NAV -->

        <div id="loading" class="status-msg">
            <span aria-busy="true">Loading Alliance Data...</span>
        </div>

        <div id="content" style="display:none;">
            <!-- HERO -->
            <div class="alliance-hero">
                <h1 id="alliance-header" class="mb-0"></h1>
            </div>

            <!-- STATS -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-rank">#--</div>
                    <div class="stat-label">Power Rank</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-members">--</div>
                    <div class="stat-label">Members (Top 1k)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-sp">--</div>
                    <div class="stat-label">Total SP</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-avg-sp">--</div>
                    <div class="stat-label">Average SP</div>
                </div>
            </div>

            <!-- ROSTER -->
            <section class="card">
                <h2>📜 Ranked Roster (Top 1000)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>SP</th>
                        </tr>
                    </thead>
                    <tbody id="roster-table">
                        <!-- JS -->
                    </tbody>
                </table>
                <!-- Compact Pagination -->
                <div class="pagination-container mb-10">
                    <small id="pageIndicator" class="text-muted" style="font-variant-numeric: tabular-nums;">Page
                        1</small>
                    <div role="group" class="mb-0" style="width:auto;">
                        <button id="btnPrev" class="outline secondary btn-small" onclick="changePage(-1)"
                            disabled>Prev</button>
                        <button id="btnNext" class="outline secondary btn-small" onclick="changePage(1)">Next</button>
                    </div>
                </div>
            </section>

            <div class="status-msg text-small mt-20">
                Alliance data is filtered from the current daily stats of the Top 1000 Infinite Leaderboard.
            </div>
        </div>

    </main>

    <script>
        const $ = (id) => document.getElementById(id);

        async function loadProfile() {
            // Get TAG from URL path
            const pathParts = window.location.pathname.split('/');
            const tag = pathParts[pathParts.length - 1]; // /alliance/:tag

            try {
                const res = await fetch(`/api/alliance/${tag}`);
                if (!res.ok) throw new Error("Alliance not found or no members on leaderboard.");
                const data = await res.json();

                // Render Header: Just the TAG
                $('alliance-header').innerHTML = `<span style="color:var(--accent-gold);">[${data.tag}]</span>`;

                // Show ALL known names equally below
                if (data.knownNames && data.knownNames.length > 0) {
                    $('alliance-header').insertAdjacentHTML('beforeend',
                        `<div style="color: #94a3b8; font-size: 1.2rem; margin-top: 5px; font-weight:normal;">
                            ${data.knownNames.join(' &bull; ')}
                        </div>`
                    );
                }

                // Render Stats
                $('stat-rank').innerText = `#${data.powerRank || '---'}`;
                $('stat-members').innerText = data.members;
                $('stat-total-sp').innerText = data.totalSP.toLocaleString();
                $('stat-avg-sp').innerText = Math.round(data.avgSP).toLocaleString();

                // Store roster for pagination
                allMembers = data.roster;
                currentPage = 1;
                renderRosterTable();

                $('loading').style.display = 'none';
                $('content').style.display = 'block';

            } catch (e) {
                $('loading').innerHTML = `<article class="error-msg text-center" style="background:rgba(255,0,0,0.1); border:1px solid #ff6b6b;">
                    <h3>Error</h3>
                    <p>${e.message}</p>
                    <a href="/" role="button" class="outline">Go Home</a>
                </article>`;
            }
        }

        let allMembers = [];
        let currentPage = 1;
        const rowsPerPage = 10;

        function renderRosterTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const slice = allMembers.slice(start, end);

            const tbody = $('roster-table');
            tbody.innerHTML = slice.map(p => `
                <tr>
                    <td>#${p.rank}</td>
                    <td><a href="/player/${p.id}" style="text-decoration:none; color:inherit;">${p.name}</a></td>
                    <td>${p.score.toLocaleString()}</td>
                </tr>
            `).join('');

            // Update Controls
            const totalPages = Math.ceil(allMembers.length / rowsPerPage);
            $('pageIndicator').innerText = `Page ${currentPage} of ${totalPages || 1}`;
            $('btnPrev').disabled = currentPage === 1;
            $('btnNext').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            currentPage += delta;
            renderRosterTable();
        }

        loadProfile();
    </script>
</body>

</html>
