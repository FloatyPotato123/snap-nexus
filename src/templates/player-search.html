<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Search - Snap Nexus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.slate.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/favicon.ico">
</head>

<body>

    <main class="container">
        <!-- NAV -->
        <nav class="container-fluid">
            <ul>
                <li><img src="/logo.png" class="header-logo" alt="Logo"><strong>Snap Nexus</strong></li>
            </ul>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/player-search" class="active">Search</a></li>
                <li><a href="/decks">Decks</a></li>
            </ul>
        </nav>

        <h1 class="text-center text-gold fw-800 mb-40">Find Player</h1>

        <div class="search-hero">
            <input type="text" id="searchInput" placeholder="Enter Player Name" aria-label="Player Name">
            <button onclick="searchPlayer()">Search</button>
        </div>

        <div id="searchResults"></div>

        <!-- LOAD MORE BUTTON -->
        <div class="text-center mt-20" id="loadMoreContainer" style="display:none;">
            <button id="loadMoreBtn" class="secondary outline" style="width: auto;" onclick="searchPlayer(true)">Load
                More Results</button>
        </div>


        <!-- Data Disclaimer -->
        <div class="disclaimer-box">
            <strong>Note:</strong> Historical data collected from the <strong>Top 1000</strong> leaderboard at daily
            reset.
            Data available since <strong>October 19, 2025</strong>.
        </div>
        </div>

        <script>
            const $ = (id) => document.getElementById(id);

            // Check URL params on load
            window.addEventListener('DOMContentLoaded', () => {
                const params = new URLSearchParams(window.location.search);
                const query = params.get('name') || params.get('q');

                if (query) {
                    $('searchInput').value = query;
                    searchPlayer();
                }
            });

            let currentCursor = 0;
            let currentQuery = '';
            let isLoadingMore = false;

            async function searchPlayer(isLoadMore = false) {
                const query = $('searchInput').value.trim();
                const resDiv = $('searchResults');
                const loadMoreBtn = $('loadMoreBtn');
                const loadMoreContainer = $('loadMoreContainer');

                if (!query) {
                    resDiv.innerHTML = '';
                    loadMoreContainer.style.display = 'none';
                    return;
                }

                if (!isLoadMore) {
                    currentCursor = 0;
                    currentQuery = query;

                    // Update URL without reloading
                    const newUrl = new URL(window.location);
                    newUrl.searchParams.set('name', query);
                    newUrl.searchParams.delete('type');
                    window.history.pushState({}, '', newUrl);

                    resDiv.innerHTML = '<div class="status-msg">Searching...</div>';
                    loadMoreContainer.style.display = 'none';
                } else {
                    isLoadingMore = true;
                    loadMoreBtn.setAttribute('aria-busy', 'true');
                }

                try {
                    const req = await fetch(`/api/players/search?name=${encodeURIComponent(query)}&cursor=${currentCursor}`);
                    if (!req.ok) throw new Error(await req.text());
                    const data = await req.json();

                    if (!isLoadMore && data.matches.length === 0) {
                        resDiv.innerHTML = `<div class="no-results"><span class="icon">🔍</span>No players found. Try a different name or check your spelling.</div>`;
                        loadMoreContainer.style.display = 'none';
                        return;
                    }

                    // Clear "Searching..." only on first load
                    if (!isLoadMore) resDiv.innerHTML = '';

                    // Turn off button loading state
                    if (isLoadMore) {
                        isLoadingMore = false;
                        loadMoreBtn.setAttribute('aria-busy', 'false');
                    }

                    data.matches.forEach(match => {
                        // Filter "Also Known As"
                        const otherNames = match.history
                            .map(h => h.name)
                            .filter(n => n !== match.name);
                        const uniqueAlsoKnown = [...new Set(otherNames)];

                        const akaStr = uniqueAlsoKnown.length > 0
                            ? `<div class="text-muted text-small mt-10">Also known as: <span style="font-style:italic; color:var(--pico-muted-color);">${uniqueAlsoKnown.slice(0, 3).join(', ')}${uniqueAlsoKnown.length > 3 ? '...' : ''}</span></div>`
                            : '';

                        // Pass params
                        const profileUrl = `/player/${match.playerId}?back_q=${encodeURIComponent(query)}`;

                        // Rank Badge
                        let rankHtml = '';
                        if (match.currentRank) {
                            rankHtml = `<div class="tag-rank">Rank ${match.currentRank}</div>`;
                        }

                        // Clickable Card -> Profile
                        const cardHTML = `
                    <article onclick="window.location.href='${profileUrl}'" class="card-clickable border-purple card-slim">
                        <div class="match-info">
                            ${rankHtml}
                            <div>
                                <h3 class="text-gold mb-0">${match.name}</h3>
                                ${akaStr ? akaStr.replace('<div class="text-muted text-small mt-10">', '<div class="aka-text">').replace('</div>', '</div>') : ''} 
                            </div>
                        </div>
                        <div class="text-gold" style="font-size:1.5rem;">›</div>
                    </article>`;

                        // Append to div
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = cardHTML;
                        resDiv.appendChild(tempDiv.firstElementChild);
                    });

                    // If no matches, show friendly message
                    if (data.matches.length === 0) {
                        resDiv.innerHTML = `<div class="no-results"><span class="icon">🔍</span>No players found. Try a different name or check your spelling.</div>`;
                    }

                    // Handle Pagination Button
                    if (data.nextCursor) {
                        currentCursor = data.nextCursor;
                        loadMoreContainer.style.display = 'block';
                        loadMoreBtn.innerText = `Load More (${data.matches.length} shown of ${data.total})`;
                    } else {
                        loadMoreContainer.style.display = 'none';
                    }

                } catch (e) {
                    if (!isLoadMore) resDiv.innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
                    else alert("Failed to load more results.");
                }
            }

            $('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchPlayer(); });
        </script>
</body>

</html>
