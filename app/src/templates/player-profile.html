<nav class="back-nav">
    <a href="/" id="backLink" class="back-btn ghost">
        <svg viewBox="0 0 24 24" class="back-arrow" width="20" height="20" stroke="currentColor" stroke-width="2"
            fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5m0 0l7 7m-7-7l7-7" />
        </svg>
        <span id="backLinkText">Back to Home</span>
    </a>
</nav>

<script>
    // Contextual Back Navigation
    const params = new URLSearchParams(window.location.search);
    const backQ = params.get('back_q');
    const ref = params.get('ref');
    const backBtn = document.getElementById('backLink');
    const backText = document.getElementById('backLinkText');

    if (backQ) {
        backText.innerText = "Back to Search Results";
        backBtn.href = `/player-search?q=${encodeURIComponent(backQ)}`;
    } else if (ref === 'leaderboard') {
        backText.innerText = "Back to Leaderboard";
        backBtn.href = "/leaderboard";
    } else if (ref === 'home') {
        backText.innerText = "Back to Home";
        backBtn.href = "/";
    }
</script>

<div id="loading" aria-busy="true" class="status-msg">Loading Profile...</div>

<div id="content" class="mb-40 d-none">

    <!-- DOSSIER LAYOUT -->
    <div class="dossier-layout">
        <section class="profile-hero">
            <h1 id="pName" class="profile-name-h1"></h1>

            <div class="hero-stats-grid">
                <!-- Core Stats (Rank/SP) -->
                <div id="pCoreStats" class="profile-stats-row core-stats-row d-none">
                    <!-- Rank Pill -->
                    <div id="pRankBadge" class="stat-pill rank d-none">
                        <span class="stat-label">Rank</span>
                        <span id="pRank" class="stat-value">--</span>
                    </div>

                    <!-- SP Pill -->
                    <div id="pSPBadge" class="stat-pill sp d-none">
                        <span class="stat-label">Snap Points</span>
                        <span id="pSP" class="stat-value">--</span>
                    </div>
                </div>

                <!-- Season Stats Section -->
                <div id="pSeasonStats" class="season-stats-block d-none">
                    <h4 class="stats-header">Season Stats</h4>
                    <div class="profile-stats-row">
                        <!-- Daily Progress (Left) -->
                        <div id="pVolatilityBadge" class="stat-pill volatility d-none">
                            <span class="stat-label">Daily Avg</span>
                            <span id="pVolatility" class="stat-value">--</span>
                        </div>

                        <!-- Best Day (Right) -->
                        <div id="pBestDayBadge" class="stat-pill best-day d-none">
                            <span class="stat-label">Best Day</span>
                            <span id="pBestDay" class="stat-value">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="pId" class="d-none"></div>
        </section>

        <!-- NAME HISTORY SIDEBAR -->
        <article id="pHistoryCard" class="history-card">
            <div class="timeline-container">
                <div id="historyTimeline" class="timeline"></div>
            </div>
        </article>
    </div>



    <!-- CHART TABS -->
    <div class="tab-container mt-40">
        <div class="tab-nav">
            <button class="tab-btn active" data-target="tab-p-season">Season Performance</button>
            <button class="tab-btn" data-target="tab-p-history">Past Finishes</button>
        </div>

        <!-- Tab 1: Season Performance -->
        <div id="tab-p-season" class="tab-content">
            <article>
                <header class="grid">
                    <div></div>
                    <div class="text-right flex-end-gap">
                        <button id="shareSeasonGraphBtn" class="btn-icon-only"
                            onclick="SnapProfile.copySeasonGraphImage()" title="Copy Image">
                            <!-- Default: Copy/Camera -->
                            <svg id="copyIcon" class="icon-svg" viewBox="0 0 24 24">
                                <path
                                    d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                                <circle cx="12" cy="13" r="3" />
                            </svg>
                            <!-- Success: Check -->
                            <svg id="copySuccessIcon" class="icon-svg d-none" viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <!-- Error: X -->
                            <svg id="copyErrorIcon" class="icon-svg d-none" viewBox="0 0 24 24">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>

                        <div id="compareUI" class="compare-tray">
                            <button id="toggleCompareBtn" class="btn-compare-toggle"
                                onclick="SnapProfile.toggleCompareSearch()">
                                <svg class="icon-svg" viewBox="0 0 24 24">
                                    <line x1="12" y1="5" x2="12" y2="19" />
                                    <line x1="5" y1="12" x2="19" y2="12" />
                                </svg>
                                <span>Compare</span>
                            </button>
                            <div id="compareSearchContainer" class="compare-search-container d-none">
                                <div class="compare-search-input-wrapper">
                                    <svg class="icon-svg compare-search-icon" viewBox="0 0 24 24">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                    <input type="text" id="compareSearchInput" class="small-input"
                                        placeholder="Search player..." autocomplete="off">
                                </div>
                                <div id="compareSuggestions" class="search-suggestions contrast small-suggestions">
                                </div>
                            </div>
                        </div>

                        <div class="text-right relative flex-end">
                            <button id="seasonTrigger" onclick="SnapProfile.toggleSeasonDropdown()" class="fake-select">
                                <span id="seasonTriggerText">Loading...</span>
                            </button>
                            <div id="seasonDropdown" class="season-dropdown"></div>
                        </div>
                    </div>
                </header>

                <div id="comparedPlayersList" class="flex-wrap-gap flex-end"></div>
                <div id="seasonChartContainer" class="chart-container">
                    <canvas id="seasonChart"></canvas>
                    <div id="noSeasonStats" class="status-msg d-none">No ranked data for this season.
                    </div>
                </div>
            </article>
        </div>

        <!-- Tab 2: Historical Ranks -->
        <div id="tab-p-history" class="tab-content d-none">
            <article>
                <div id="historicalChartContainer" class="chart-container">
                    <canvas id="historicalChart"></canvas>
                </div>
                <div id="noHistoricalStats" class="status-msg d-none">No historical season finishes
                    found.</div>
            </article>
        </div>
    </div>

    <!-- Data Disclaimer -->
    <div class="disclaimer-box">
        <strong>Note:</strong> Historical data collected from the <strong>Top 1000</strong> leaderboard at daily
        reset.
        Data available since <strong>October 19, 2025</strong>.
    </div>
</div>
