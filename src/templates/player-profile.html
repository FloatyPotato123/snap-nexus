<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile - Snap Nexus</title>
    <!-- Pico.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.slate.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/favicon.ico">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- Shared Season Logic -->
    <script src="/client-utils.js"></script>
    <style>
        /* Timeline Component */
        .timeline {
            position: relative;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            margin-left: 10px;
            padding-left: 25px;
            padding-top: 10px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        /* The Dot */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -31px;
            top: 5px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-gold);
            border: 2px solid #1e293b;
            /* Match bg to create 'gap' effect */
            box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.2);
        }

        /* Different color for past names if wanted, or keep uniform */
        .timeline-item.past::before {
            background: #64748b;
            box-shadow: none;
        }

        .timeline-date {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
            font-family: monospace;
        }

        .timeline-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f8fafc;
        }
    </style>
</head>

<body>

    <main class="container">
        <!-- NAV -->

        <a href="/" id="backLink" class="secondary">← Back to Home</a>

        <script>
            // Contextual Back Navigation
            const params = new URLSearchParams(window.location.search);
            const backQ = params.get('back_q');
            const ref = params.get('ref');
            const backBtn = document.getElementById('backLink');

            if (backQ) {
                backBtn.innerText = "← Back to Search Results";
                backBtn.href = `/player-search?q=${encodeURIComponent(backQ)}`;
            } else if (ref === 'leaderboard') {
                backBtn.innerText = "← Back to Leaderboard";
                backBtn.href = "/leaderboard";
            } else if (ref === 'home') {
                backBtn.innerText = "← Back to Home";
                backBtn.href = "/";
            }
        </script>

        <div id="loading" aria-busy="true" class="status-msg">Loading Profile...</div>

        <div id="content" class="mb-40" style="display:none;">

            <!-- HEADER -->
            <article class="text-center border-gold">
                <!-- Current Rank Badge -->
                <div id="pRankBadge" class="mt-10" style="display:none;">
                    <div class="tag-rank-lg">Rank <span id="pRank">--</span></div>
                </div>

                <h1 id="pName" class="mt-10 mb-0" style="font-size:2.5rem;"></h1>
                <div id="pId" style="display:none;"></div>
            </article>

            <!-- NAME HISTORY -->
            <article>
                <header>Name History</header>
                <div id="historyTimeline" class="timeline"></div>
            </article>



            <!-- 2. Season Performance -->
            <article>
                <header class="grid">
                    <div>Season Performance</div>
                    <div class="text-right"
                        style="display:flex; justify-content:flex-end; gap:10px; align-items:center;">
                        <button id="shareSeasonGraphBtn" class="outline contrast" onclick="copySeasonGraphImage()"
                            style="padding: 4px 8px; font-size: 0.8rem; border-radius: 4px;">📸 Copy Image</button>
                        <select id="seasonSelect" class="small-select" style="margin-bottom:0; width:auto;"></select>
                    </div>
                </header>
                <div id="seasonChartContainer" class="chart-container">
                    <canvas id="seasonChart"></canvas>
                    <div id="noSeasonStats" class="status-msg" style="display:none;">No ranked data for this season.
                    </div>
                </div>
            </article>

            <!-- 3. Historical Season Ranks -->
            <article>
                <header>Historical Season Finishes</header>
                <div id="historicalChartContainer" class="chart-container">
                    <canvas id="historicalChart"></canvas>
                </div>
                <div id="noHistoricalStats" class="status-msg" style="display:none;">No historical season finishes
                    found.</div>
            </article>

            <!-- Data Disclaimer -->
            <div class="disclaimer-box">
                <strong>Note:</strong> Historical data collected from the <strong>Top 1000</strong> leaderboard at daily
                reset.
                Data available since <strong>October 19, 2025</strong>.
            </div>
        </div>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const pathParts = window.location.pathname.split('/');
        const playerId = pathParts[pathParts.length - 1];

        // Global Chart Defaults
        Chart.defaults.font.family = "'Inter', system-ui, -apple-system, sans-serif";
        Chart.defaults.color = '#aaa';
        Chart.defaults.borderColor = 'rgba(255,255,255,0.1)';

        // Chart Instances
        let seasonChartInstance = null;
        let historicalChartInstance = null;

        function populateSeasonSelector() {
            const select = $('seasonSelect');
            const now = new Date();
            const startYear = 2025;
            const startMonth = 9; // October index (0-11)

            // Loop from current date down to Nov 2025
            let y = now.getFullYear();
            let m = now.getMonth();

            // Marvel Snap Season Logic: Starts first Tuesday
            const activeSeason = SnapUtils.getCurrentSeason(now);
            y = activeSeason.year;
            m = activeSeason.month - 1; // 0-indexed for loop


            // Loop backwards to startYear
            while (y > startYear || (y === startYear && m >= startMonth)) {

                const opt = document.createElement('option');
                opt.value = `${y}-${m + 1}`; // 2026-1 for Jan
                const monthName = new Date(y, m).toLocaleString('default', { month: 'long' });
                opt.text = `${monthName} ${y}`;
                select.appendChild(opt);

                m--;
                if (m < 0) { m = 11; y--; }
            }

            // Handle loading new data on change
            select.addEventListener('change', async () => {
                const [year, month] = select.value.split('-');
                await loadSeasonData(year, month);
            });
        }

        async function loadSeasonData(year, month) {
            try {
                // If loading specific season, re-fetch profile with params
                // Note: This fetches everything again, but allows us to reuse the robust API logic
                // Could optimize later to fetch stats-only if needed.
                const req = await fetch(`/api/player/${playerId}?month=${month}&year=${year}`);
                if (!req.ok) throw new Error("Failed to load season");
                const data = await req.json();

                if (data.currentSeasonStats && data.currentSeasonStats.length > 0) {
                    $('seasonChart').style.display = 'block';
                    $('noSeasonStats').style.display = 'none';
                    $('seasonChartContainer').style.height = '350px';
                    renderSeasonChart(data.currentSeasonStats);
                } else {
                    $('seasonChart').style.display = 'none';
                    $('noSeasonStats').style.display = 'block';
                    $('seasonChartContainer').style.height = 'auto'; // Collapse
                }
            } catch (e) { }
        }

        async function loadProfile() {
            try {
                populateSeasonSelector();

                const req = await fetch(`/api/player/${playerId}`);
                if (!req.ok) throw new Error("Player not found");
                const data = await req.json();

                $('pName').innerText = data.name;
                $('pId').innerText = data.id;

                // Current Rank
                if (data.currentRank) {
                    $('pRank').innerText = data.currentRank;
                    $('pRank').dataset.rank = data.currentRank;
                    // Store Live SP for Image Gen
                    $('pRank').dataset.sp = data.currentSP || '';
                    $('pRankBadge').style.display = 'block';
                } else {
                    $('pRankBadge').style.display = 'none';
                    $('pRank').dataset.sp = '';
                    $('pRank').dataset.rank = '';
                }

                // Alliance Info
                // Render Header
                const allianceHtml = data.alliance ?
                    `<span class="tag-alliance"><a href="/alliance/${data.alliance.tag}" style="color:inherit; text-decoration:none;">[${data.alliance.tag}]</a></span> ` : '';

                $('pName').innerHTML = `${allianceHtml}${data.name}`;
                $('pName').dataset.rawName = data.name;
                document.title = `${data.name} | Snap Nexus`;

                // History Timeline
                let timelineHtml = '';
                // Sort history desc (newest first) explicitly
                const historyList = (data.history || []).sort((a, b) => new Date(b.seenAt) - new Date(a.seenAt));

                historyList.forEach((h, index) => {
                    const isCurrent = index === 0;
                    const isOldest = index === historyList.length - 1;
                    const dateClass = isCurrent ? 'timeline-date' : 'timeline-date';
                    const dotClass = isCurrent ? '' : 'past';
                    const label = isOldest ? '' : h.seenAt;

                    timelineHtml += `
                        <div class="timeline-item ${dotClass}">
                            <div class="timeline-name">${h.name}</div>
                            <div class="${dateClass}">${label}</div>
                        </div>
                    `;
                });
                $('historyTimeline').innerHTML = timelineHtml || '<div class="status-msg">No history found</div>';

                // Charts & Stats
                if (data.currentSeasonStats && data.currentSeasonStats.length > 0) {
                    $('seasonChart').style.display = 'block';
                    $('noSeasonStats').style.display = 'none';
                    $('seasonChartContainer').style.height = '350px';
                    renderSeasonChart(data.currentSeasonStats);
                } else {
                    $('seasonChart').style.display = 'none';
                    $('noSeasonStats').style.display = 'block';
                    $('seasonChartContainer').style.height = 'auto'; // Collapse
                }

                if (data.historicalSeasonRanks && data.historicalSeasonRanks.length > 0) {
                    $('historicalChart').style.display = 'block';
                    $('noHistoricalStats').style.display = 'none';
                    $('historicalChartContainer').style.height = '350px';
                    renderHistoricalChart(data.historicalSeasonRanks);
                } else {
                    $('historicalChart').style.display = 'none';
                    $('noHistoricalStats').style.display = 'block';
                    $('historicalChartContainer').style.height = 'auto'; // Collapse
                }

                $('loading').style.display = 'none';
                $('content').style.display = 'block';
            } catch (e) {
                $('loading').innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
            }
        }

        function renderSeasonChart(stats) {
            const ctx = $('seasonChart').getContext('2d');
            if (seasonChartInstance) seasonChartInstance.destroy();

            seasonChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: stats.map(s => {
                        const d = new Date(s.date);
                        return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
                    }),
                    datasets: [
                        {
                            label: 'Rank',
                            data: stats.map(s => s.rank),
                            borderColor: '#2196F3', // Blue
                            backgroundColor: 'rgba(33, 150, 243, 0)', // Transparent
                            yAxisID: 'y',
                            tension: 0.2,
                            fill: false,
                            borderDash: [5, 5]
                        },
                        {
                            label: 'SP',
                            data: stats.map(s => s.sp),
                            borderColor: '#ffcc00', // Gold
                            backgroundColor: 'rgba(255, 204, 0, 0.1)', // Gold Fill
                            yAxisID: 'y1',
                            tension: 0.2,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { color: '#333' }, ticks: { color: '#aaa' } },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            reverse: true, // Rank 1 top
                            suggestedMin: 1,
                            suggestedMax: 100,
                            title: { display: true, text: 'Rank', color: '#2196F3' },
                            grid: { color: '#333' },
                            ticks: { color: '#2196F3' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: 'Snap Points', color: '#ffcc00' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#ffcc00' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#fff' } }
                    }
                }
            });
            // 6. Attach raw stats for image generation
            seasonChartInstance.rawStats = stats;
        }

        function renderHistoricalChart(stats) {
            const ctx = $('historicalChart').getContext('2d');
            if (historicalChartInstance) historicalChartInstance.destroy();

            historicalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: stats.map(s => s.season),
                    datasets: [
                        {
                            label: 'Season End Rank',
                            data: stats.map(s => s.rank),
                            borderColor: '#2196F3', // Blue (Rank)
                            backgroundColor: 'rgba(33, 150, 243, 0)',
                            yAxisID: 'y',
                            tension: 0.2,
                            fill: false,
                            borderDash: [5, 5]
                        },
                        {
                            label: 'Season End SP',
                            data: stats.map(s => s.sp),
                            borderColor: '#ffcc00', // Gold (SP)
                            backgroundColor: 'rgba(255, 204, 0, 0.1)',
                            yAxisID: 'y1',
                            tension: 0.2,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { color: '#333' }, ticks: { color: '#aaa' } },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            reverse: true, // Rank 1 top
                            suggestedMin: 1,
                            suggestedMax: 100,
                            title: { display: true, text: 'Rank', color: '#2196F3' },
                            grid: { color: '#333' },
                            ticks: { color: '#2196F3' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: 'Snap Points', color: '#ffcc00' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#ffcc00' }
                        }
                    }
                }
            });
        }

        function copySeasonGraphImage() {
            const btn = $('shareSeasonGraphBtn');
            const originalText = btn.innerText;
            btn.innerText = "Generating...";
            btn.setAttribute('aria-busy', 'true');

            // We wrap the entire generation in the ClipboardItem Promise
            // This ensures the "write" call happens immediately (sync context) 
            const blobPromise = new Promise(async (resolve, reject) => {
                try {
                    // Check if chart exists
                    if (!seasonChartInstance) throw new Error("No chart to copy");

                    // 1. Calculate Rank/SP Data FIRST to determine layout
                    let rankText = null;
                    let spText = null;

                    const selectedVal = $('seasonSelect').value;
                    if (selectedVal) {
                        const [yearStr, monthStr] = selectedVal.split('-');
                        const sYear = parseInt(yearStr);
                        const sMonth0 = parseInt(monthStr) - 1;

                        const now = new Date();
                        const active = SnapUtils.getCurrentSeason(now);
                        const activeKey = `${active.year}-${active.month}`;
                        const isCurrentSeason = selectedVal === activeKey;

                        const rawStats = seasonChartInstance.rawStats || [];

                        // 1. Current Season Live Data
                        if (isCurrentSeason) {
                            const pRankBadge = $('pRankBadge');
                            if (pRankBadge && pRankBadge.style.display !== 'none') {
                                rankText = "Rank " + $('pRank').dataset.rank;
                                const liveSP = $('pRank').dataset.sp;
                                spText = liveSP ? `${parseInt(liveSP).toLocaleString()} SP` : null;
                            }
                        }
                        // 2. Past Season Historical Data
                        else if (rawStats.length > 0) {
                            const lastEntry = rawStats[rawStats.length - 1];
                            const lastRank = lastEntry.rank;
                            const lastSP = lastEntry.sp;

                            const seasonEndDate = SnapUtils.getSeasonEndForMonth(sYear, sMonth0);
                            const seasonEndStr = seasonEndDate.toISOString().split('T')[0];

                            // Also allow the day before (Monday) in case the Tuesday snapshot is missing/empty
                            const prevDate = new Date(seasonEndDate);
                            prevDate.setUTCDate(prevDate.getUTCDate() - 1);
                            const prevDateStr = prevDate.toISOString().split('T')[0];

                            // Check: Data is from Season End OR Day Before
                            if ((lastEntry.date === seasonEndStr || lastEntry.date === prevDateStr) && lastRank) {
                                rankText = "Rank " + lastRank;
                                spText = lastSP ? `${lastSP.toLocaleString()} SP` : null;
                            }
                        }
                    }

                    // 2. Setup Layout
                    // Reduced from 1600x900 to be more screen friendly, but keeping 16:9
                    const width = 1200;
                    const height = 675;
                    const padding = 40;
                    // Dynamic Header Height: 160 if we show rank, 120 (standard) if we don't
                    const headerHeight = rankText ? 160 : 120;

                    // 3. Setup Export Canvas
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');

                    // 4. Background
                    ctx.fillStyle = '#1e293b'; // Slate 800
                    ctx.fillRect(0, 0, width, height);

                    // 5. Render High-Res Chart (Off-screen)
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = width - (padding * 2);
                    tempCanvas.height = height - headerHeight - padding;
                    const tempCtx = tempCanvas.getContext('2d');

                    // Clone Config & Scale Fonts
                    // Scale factor reduced slightly for smaller canvas
                    const scaleFactor = 1.5;
                    const originalConfig = seasonChartInstance.config;
                    const newOptions = JSON.parse(JSON.stringify(originalConfig.options));

                    newOptions.animation = false; // Instant render
                    newOptions.responsive = false;
                    newOptions.maintainAspectRatio = false;
                    newOptions.devicePixelRatio = 1; // 1:1 pixel mapping to avoid clipping

                    // Helper to safely set font size
                    const setFont = (obj, size) => {
                        if (!obj.font) obj.font = {};
                        obj.font.size = size;
                        obj.font.family = "'Inter', system-ui, sans-serif";
                    };

                    // Scale Axis Fonts
                    if (newOptions.scales.x && newOptions.scales.x.ticks) setFont(newOptions.scales.x.ticks, 14 * scaleFactor);
                    if (newOptions.scales.y && newOptions.scales.y.ticks) setFont(newOptions.scales.y.ticks, 14 * scaleFactor);
                    if (newOptions.scales.y1 && newOptions.scales.y1.ticks) setFont(newOptions.scales.y1.ticks, 14 * scaleFactor);

                    // Scale Legend
                    if (newOptions.plugins && newOptions.plugins.legend && newOptions.plugins.legend.labels) {
                        setFont(newOptions.plugins.legend.labels, 14 * scaleFactor);
                        newOptions.plugins.legend.labels.boxWidth = 40; // bigger boxes
                    }

                    // Create Temp Chart
                    const tempChart = new Chart(tempCtx, {
                        type: 'line',
                        data: originalConfig.data, // Shared data reference is fine
                        options: newOptions
                    });

                    // Wait for render (Chart.js needs a tick even with animation:false sometimes)
                    await new Promise(r => setTimeout(r, 50));

                    // Draw Temp Chart to Main Canvas
                    ctx.drawImage(tempCanvas, padding, headerHeight);

                    // Destroy temp to free memory
                    tempChart.destroy();
                    tempCanvas.remove();

                    // 6. Draw Custom Header Text
                    const rawName = $('pName').dataset.rawName || $('pName').innerText.replace('Loading Profile...', '').trim();
                    const seasonName = $('seasonSelect').options[$('seasonSelect').selectedIndex].text;

                    ctx.textBaseline = 'top';

                    // Name
                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'bold 48px system-ui, -apple-system, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(rawName, padding, padding + 15);

                    // Season (Right)
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '30px system-ui, -apple-system, sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(seasonName, width - padding, padding + 25);

                    // Rank & SP (Below Name, if exists)
                    if (rankText) {
                        ctx.textAlign = 'left';
                        const rankY = padding + 75;

                        ctx.fillStyle = '#2196F3'; // Blue
                        ctx.font = 'bold 32px system-ui, -apple-system, sans-serif';
                        ctx.fillText(rankText, padding, rankY);

                        if (spText) {
                            const rankWidth = ctx.measureText(rankText).width;
                            ctx.fillStyle = '#ffcc00'; // Gold
                            ctx.font = 'bold 32px system-ui, -apple-system, sans-serif';
                            ctx.fillText(spText, padding + rankWidth + 25, rankY);
                        }
                    }

                    // 7. Finalize Blob
                    canvas.toBlob((blob) => {
                        if (blob) resolve(blob);
                        else reject(new Error("Blob failed"));
                    }, 'image/png');

                } catch (e) {
                    reject(e);
                }
            });

            // Trigger Copy
            navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blobPromise })
            ]).then(() => {
                btn.removeAttribute('aria-busy');
                btn.innerText = "✅ Copied!";
                setTimeout(() => btn.innerText = originalText, 2500);
            }).catch((err) => {
                console.error("Clipboard write failed", err);
                btn.removeAttribute('aria-busy');
                btn.innerText = "❌ Error";
                // alert("Could not copy: " + (err.message || err));
                setTimeout(() => btn.innerText = originalText, 2500);
            });
        }
        loadProfile();
    </script>
</body>

</html>
