<a href="/" id="backLink" class="secondary">← Back to Home</a>

<script>
    // Contextual Back Navigation
    const params = new URLSearchParams(window.location.search);
    const backQ = params.get('back_q');
    const ref = params.get('ref');
    const backBtn = document.getElementById('backLink');

    if (backQ) {
        backBtn.innerText = "← Back to Search Results";
        backBtn.href = `/player-search?q=${encodeURIComponent(backQ)}`;
    } else if (ref === 'leaderboard') {
        backBtn.innerText = "← Back to Leaderboard";
        backBtn.href = "/leaderboard";
    } else if (ref === 'home') {
        backBtn.innerText = "← Back to Home";
        backBtn.href = "/";
    }
</script>

<div id="loading" aria-busy="true" class="status-msg">Loading Profile...</div>

<div id="content" class="mb-40 d-none">

    <!-- HEADER -->
    <article class="text-center border-gold">
        <!-- Current Rank Badge -->
        <div id="pRankBadge" class="mt-10 d-none d-inline-block mr-10">
            <div class="tag-rank-lg">Rank <span id="pRank">--</span></div>
        </div>
        <div id="pSPBadge" class="mt-10 d-none valign-top">
            <div class="tag-rank-lg sp-badge">
                <span id="pSP">--</span> SP
            </div>
        </div>

        <h1 id="pName" class="mt-10 mb-0 font-2-5rem"></h1>
        <div id="pId" class="d-none"></div>
    </article>

    <!-- NAME HISTORY -->
    <article>
        <header>Name History</header>
        <div id="historyTimeline" class="timeline"></div>
    </article>



    <!-- 2. Season Performance -->
    <article>
        <header class="grid">
            <div>Season Performance</div>
            <div class="text-right flex-end-gap">
                <button id="shareSeasonGraphBtn" class="btn-ghost" onclick="copySeasonGraphImage()">
                    📸 Copy
                </button>
                <select id="seasonSelect" class="small-select season-select"></select>
            </div>
        </header>
        <div id="seasonChartContainer" class="chart-container">
            <canvas id="seasonChart"></canvas>
            <div id="noSeasonStats" class="status-msg d-none">No ranked data for this season.
            </div>
        </div>
    </article>

    <!-- 3. Historical Season Ranks -->
    <article>
        <header>Historical Season Finishes</header>
        <div id="historicalChartContainer" class="chart-container">
            <canvas id="historicalChart"></canvas>
        </div>
        <div id="noHistoricalStats" class="status-msg d-none">No historical season finishes
            found.</div>
    </article>

    <!-- Data Disclaimer -->
    <div class="disclaimer-box">
        <strong>Note:</strong> Historical data collected from the <strong>Top 1000</strong> leaderboard at daily
        reset.
        Data available since <strong>October 19, 2025</strong>.
    </div>
</div>
