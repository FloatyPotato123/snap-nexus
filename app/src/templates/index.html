<h1 class="hero-title mb-lg">Infinite Dashboard</h1>
<!-- SECTION 1: SEASON CHARTS -->
<div class="tab-container mt-lg">
    <div class="tab-nav">
        <button class="tab-btn active" data-target="tab-current">Season Trajectory</button>
        <button class="tab-btn" data-target="tab-history">Historical Totals</button>
    </div>

    <!-- Tab 1: Current Season -->
    <div id="tab-current" class="tab-content">
        <article class="relative">
            <header class="grid">
                <div class="flex-center">
                    <span id="infinite-header-container" class="infinite-badge" style="margin-left: 0;">
                        <span class="live-dot"></span>
                        <span class="text-gold count" id="infinite-count-header">0</span>
                        <span class="text-muted label">Infinite Players</span>
                    </span>
                </div>
                <div class="text-right relative flex-end">
                    <button id="seasonTrigger" onclick="toggleSeasonDropdown()" class="fake-select">
                        <span id="seasonTriggerText">Loading...</span>
                    </button>

                    <div id="seasonDropdown" class="season-dropdown">

                    </div>
                </div>
            </header>

            <div id="seasonChartContainer" class="chart-container">
                <canvas id="seasonChart"></canvas>
                <div id="noSeasonData" class="status-msg" style="display:none;">No data available for this season yet
                </div>
            </div>
        </article>
    </div>

    <!-- Tab 2: History -->
    <div id="tab-history" class="tab-content d-none">
        <article>
            <header class="flex-between mb-sm" style="padding: 0 5px; justify-content: flex-end;">
                <div class="native-toggle-group">
                    <button id="btnTotal" class="native-toggle-btn active"
                        onclick="setHistoryView('total')">Total</button>
                    <button id="btnAvg" class="native-toggle-btn" onclick="setHistoryView('avg')">Daily Avg</button>
                </div>
            </header>
            <div id="history-chart-container" class="chart-container">
                <canvas id="historyChart"></canvas>
            </div>
        </article>
    </div>
</div>


<!-- SECTION 2 REMOVED: Metadata/Movers currently unavailable due to API changes -->

<!-- Data Disclaimer -->
<div class="disclaimer-box">
    <strong>Note:</strong> Historical data collected from the <strong>Top 1000</strong> leaderboard at daily reset.
    Individual player and name change tracking have been disabled due to changes in the Marvel Snap API.
    Data available since <strong>October 19, 2025</strong>.
</div>
