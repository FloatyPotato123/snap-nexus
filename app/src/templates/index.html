<!-- DASHBOARD WIDGETS -->
<section class="tab-container desktop-grid-mobile-tabs mb-lg">
    <div class="tab-nav mobile-only-tabs">
        <button class="tab-btn active" data-target="tab-hot-location">Hot Location</button>
        <button class="tab-btn" data-target="tab-card-schedule">Card Schedule</button>
    </div>

    <div class="dashboard-widgets-grid responsive-grid">
        <div id="tab-hot-location" class="tab-content responsive-tab-item">
            <div id="hot-location-widget" class="widget-card h-100">
                <h3 class="mb-sm font-1rem">Hot Location</h3>
                <div id="hot-location-content" class="widget-content">
                    <div class="skeleton-text">Loading locations...</div>
                </div>
            </div>
        </div>

        <div id="tab-card-schedule" class="tab-content responsive-tab-item d-none">
            <div id="card-schedule-widget" class="widget-card h-100">
                <h3 class="mb-sm font-1rem">Card Schedule</h3>
                <div id="card-schedule-content" class="widget-content">
                    <div class="skeleton-text">Loading schedule...</div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- SECTION 2: MOVERS (New on Board & Biggest Gainers) -->
<section id="movers-section" class="tab-container desktop-grid-mobile-tabs mb-lg">
    <div class="tab-nav mobile-only-tabs">
        <button class="tab-btn active" data-target="tab-gainers">🚀 Biggest Gainers</button>
        <button class="tab-btn" data-target="tab-newbie">✨ New on Board</button>
    </div>
    
    <div class="movers-grid responsive-grid">
        <!-- Biggest Gainers (24h) -->
        <div id="tab-gainers" class="tab-content responsive-tab-item">
            <div class="mover-card h-100 leaderboard-table-container">
                <h3 class="mb-sm font-1rem"><span class="movers-header-text">🚀 Biggest Gainers </span><small id="subtitle-gainers"
                        class="text-muted subtitle-small">Loading...</small></h3>
                <table id="gainers-table">
                    <tbody>
                        <tr>
                            <td>Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- New on Board (Highest entries vs 24h ago) -->
        <div id="tab-newbie" class="tab-content responsive-tab-item d-none">
            <div class="mover-card h-100 leaderboard-table-container">
                <h3 class="mb-sm font-1rem"><span class="movers-header-text">✨ New on Board </span><small id="subtitle-newbie"
                        class="text-muted subtitle-small">Loading...</small></h3>
                <table id="newbie-table">
                    <tbody>
                        <tr>
                            <td>Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- SECTION 1: SEASON CHARTS -->
<div class="tab-container mt-lg">
    <div class="tab-nav">
        <button class="tab-btn active" data-target="tab-current">Season Trajectory</button>
        <button class="tab-btn" data-target="tab-history">Historical Totals</button>
    </div>

    <!-- Tab 1: Current Season -->
    <div id="tab-current" class="tab-content">
        <article class="relative">
            <header class="grid">
                <div class="flex-center">
                    <span id="infinite-header-container" class="infinite-badge" style="margin-left: 0;">
                        <span class="live-dot"></span>
                        <span class="text-gold count" id="infinite-count-header">0</span>
                        <span class="text-muted label">Infinite Players</span>
                    </span>
                </div>
                <div class="text-right relative flex-end">
                    <button id="seasonTrigger" onclick="toggleSeasonDropdown()" class="fake-select">
                        <span id="seasonTriggerText">Loading...</span>
                    </button>

                    <div id="seasonDropdown" class="season-dropdown">

                    </div>
                </div>
            </header>

            <div id="seasonChartContainer" class="chart-container">
                <canvas id="seasonChart"></canvas>
                <div id="noSeasonData" class="status-msg" style="display:none;">No data available for this season yet
                </div>
            </div>
        </article>
    </div>

    <!-- Tab 2: History -->
    <div id="tab-history" class="tab-content d-none">
        <article>
            <header class="flex-between mb-sm" style="padding: 0 5px; justify-content: flex-end;">
                <div class="native-toggle-group">
                    <button id="btnTotal" class="native-toggle-btn active"
                        onclick="setHistoryView('total')">Total</button>
                    <button id="btnAvg" class="native-toggle-btn" onclick="setHistoryView('avg')">Daily Avg</button>
                </div>
            </header>
            <div id="history-chart-container" class="chart-container">
                <canvas id="historyChart"></canvas>
            </div>
        </article>
    </div>
</div>
